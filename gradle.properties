#Kotlin
kotlin.daemon.jvmargs=-Xmx6G -XX:+UseG1GC
# Work around Kotlin/Wasm KT-82395 when compiler plugins generate top-level declarations.
kotlin.incremental.js=false
kotlin.incremental.js.klib=false
kotlin.mpp.appleFrameworkCheckXcodeTargets=false
kotlin.native.ignoreDisabledTargets=true
#Gradle
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.jvmargs=-Xmx6G -XX:+UseG1GC -XX:-HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
